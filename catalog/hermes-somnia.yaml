name: hermes-somnia
title: Somnia
repo: https://github.com/victorhurchella/hermes-somnia
sha: 0000000000000000000000000000000000000000
description: "OpenClaw-style memory dreaming with a desktop page (English and Brazilian Portuguese). Every night a script-only cron job (no agent turn) rereads your recent interactive sessions. By default (focus: insights) it looks for how you judge (principles, values, taste, what you want from answers) and proposes insights, each needing two occasions on different days and backed by verbatim quotes from your own turns; you approve them by ticking a checkbox in your vault, on the page or on the CLI, and approved ones go to a generated note the agent is pointed at, plus up to three one-line rules in USER.md. An empty night is normal. With focus: facts or both it runs Light -> REM -> Deep: it extracts candidate facts, each backed by a verbatim quote, scores what keeps coming back across sessions (six signals plus switchable principles: Pareto, Lindy, Occam, Feynman; Inversion opt-in, with a published benchmark) and consolidates the winners into MEMORY.md/USER.md within their char budget, or into an inbox folder of your markdown vault. A desktop sidebar page shows what was learned and why, memory as space, near-misses, the sleep chart and the Dream Diary, with keep, forget forever, edit, pin, move to vault and undo, plus Optimize (a shorter MEMORY.md/USER.md, every rewrite checked by code and a second model pass, approved entry by entry) and a memory Limit control. Disclosure: reads state.db (read-only), MEMORY.md/USER.md, config.yaml and cron/jobs.json; writes memory through Hermes' MemoryStore (or the /memory pending queue with destructive: stage), its own state and backups in $HERMES_HOME/plugin-data/hermes-somnia, memory.*_char_limit in config.yaml only when the user changes a Limit (via hermes config set), one cron job plus its script in $HERMES_HOME/scripts, and, in vault mode, only <vault>/somnia/ plus the one insights_note file when the user points it elsewhere in the vault (it also reads the notes listed in insights_known_notes and runs vault_pull_command/vault_sync_command when set). Model calls go to the user's own Hermes provider (or auxiliary.somnia) and contain excerpts of user turns and final agent replies, with secrets masked first; a night with no new conversation makes no call. No other network calls, telemetry or credentials. Imports private modules with fallbacks: tools.memory_tool, tools.write_approval, agent.auxiliary_client, hermes_cli.plugins_state."
