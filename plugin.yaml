name: hermes-somnia
label: Somnia
version: 0.2.0
description: "Somnia: OpenClaw-style memory dreaming for Hermes. A nightly Light -> REM -> Deep sweep reads your recent sessions, scores what keeps coming back (with switchable thinking principles: Pareto, Lindy, Inversion, Occam, Feynman) and consolidates it into MEMORY.md/USER.md or your markdown second brain. Includes a desktop page, a Dream Diary, forget/pin/undo."
author: victorhurchella
license: MIT
homepage: https://github.com/victorhurchella/hermes-somnia
kind: standalone
tags:
  - memory
  - dreaming
  - consolidation
  - second-brain
  - obsidian
  - desktop
provides_tools: []
provides_hooks: []
requires_env: []

config_schema:
  destinations:
    type: str
    choices: [builtin, vault, both]
    default: builtin
    label: Destination
    description: "builtin = curate MEMORY.md/USER.md under their char budget; vault = write to a markdown second brain (Obsidian-style) inbox; both = both"
  destructive:
    type: str
    choices: [apply, stage]
    default: apply
    label: Merges and removals
    description: "apply = write them directly, like OpenClaw (backup before every write, `hermes somnia undo`); stage = they wait in /memory pending for your approval"
  principles:
    type: list
    default: [pareto, lindy, occam, feynman]
    label: Principles
    description: "Thinking rules Somnia applies: pareto (keep the vital few under pressure), lindy (protect long-confirmed facts), inversion (mistakes first, opt-in), occam (shortest true phrasing), feynman (entries stand alone)"
  schedule:
    type: str
    default: "0 3 * * *"
    label: Schedule
    description: Cron expression used by `hermes somnia setup`
  timezone:
    type: str
    default: ""
    label: Timezone
    description: IANA name for day boundaries; empty = host local time
  vault_path:
    type: str
    default: ""
    label: Vault path
    description: Root of your second brain. Empty = $OBSIDIAN_VAULT_PATH, then $WIKI_PATH
  vault_folder:
    type: str
    default: somnia
    label: Vault inbox folder
    description: Somnia-owned folder inside the vault; Somnia never writes anywhere else in the vault
  protected_paths:
    type: list
    default: []
    label: Protected vault paths
    description: Vault-relative folders Somnia must never write into (the inbox may not overlap them)
  vault_pointer:
    type: bool
    default: true
    label: Pointer in MEMORY.md
    description: Keep one short MEMORY.md entry telling the agent where the Somnia inbox lives
  max_promotions:
    type: int
    default: 3
    label: Promotions per night
  min_score:
    type: float
    default: 0.65
    label: Minimum score
  min_sessions:
    type: int
    default: 2
    label: Minimum distinct sessions
    description: A fact must show up in this many sessions (an explicit "remember this" or a pin bypasses it)
  headroom:
    type: float
    default: 0.1
    label: Budget headroom
    description: Fraction of each memory char budget Somnia leaves free
  notify:
    type: str
    choices: [changes, always, never]
    default: changes
    label: Morning report
    description: When the nightly job prints its morning report (and so delivers it)
  diary:
    type: bool
    default: true
    label: Dream Diary
  mask_secrets:
    type: bool
    default: true
    label: Mask secrets
    description: Redact tokens, keys and passwords from conversations before they reach the model
  max_extract_calls:
    type: int
    default: 12
    label: Max extraction calls per night
    description: Caps cost; a busy day is spread over the next nights instead of being skipped
